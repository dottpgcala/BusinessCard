<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piergiorgio Calà — Valori Asset Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bordeaux:#7A1E2B;
    --bordeaux-dark:#6A1A25;
    --gold:#C1913F;
    --gold-light:#CFA65C;
    --paper:#FDFDFB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    background:linear-gradient(160deg,#EFEDE8 0%,#E3E0D8 100%);
    font-family:'Jost','Futura','Century Gothic',sans-serif;
    padding:32px 16px;
  }
  .scene{
    width:min(520px,92vw);
    aspect-ratio:85/55;
    perspective:1600px;
    cursor:pointer;
  }
  .card{
    position:relative;
    width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.4,.15,.2,1);
  }
  .scene.flipped .card{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:12px;
    box-shadow:0 18px 45px rgba(60,30,35,.28),0 4px 12px rgba(60,30,35,.15);
    overflow:hidden;
  }
  /* ---------- FRONT ---------- */
  .front{
    background:var(--paper);
    padding:7.5% 8.5%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .name{
    font-size:clamp(18px,5.4cqw,30px);
    font-weight:700;
    letter-spacing:.06em;
    color:var(--bordeaux);
    text-transform:uppercase;
  }
  .role{
    font-size:clamp(11px,3.1cqw,17px);
    font-weight:300;
    font-style:italic;
    color:var(--gold);
    margin-top:2px;
    letter-spacing:.02em;
  }
  .contact{
    margin-top:10px;
    font-size:clamp(11px,3.1cqw,17px);
    color:var(--bordeaux);
    line-height:1.45;
    font-weight:400;
  }
  .contact a{color:var(--bordeaux);text-decoration:none;}
  .bottom{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:12px;
  }
  .qr{width:30%;max-width:120px;aspect-ratio:1;flex:none;}
  .qr svg{width:100%;height:100%;display:block;}
  .addr{
    text-align:left;
    font-size:clamp(10px,2.9cqw,16px);
    color:var(--bordeaux);
    line-height:1.5;
  }
  .addr .site{
    color:var(--gold);
    font-weight:700;
    letter-spacing:.04em;
    margin-top:6px;
  }
  .addr a{text-decoration:none;color:inherit;}
  .scene{container-type:inline-size;}
  /* ---------- BACK ---------- */
  .back{
    background:var(--bordeaux);
    background:radial-gradient(120% 140% at 30% 20%, #85253385 0%, transparent 60%), var(--bordeaux);
    transform:rotateY(180deg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4cqw;
  }
  .logomark{width:17%;max-width:92px;}
  .wordmark{text-align:center;}
  .wordmark .valori{
    font-family:'Cinzel','Trajan Pro',serif;
    font-size:clamp(20px,6.4cqw,36px);
    letter-spacing:.34em;
    margin-left:.34em;
    color:var(--gold-light);
    font-weight:400;
  }
  .wordmark .am{
    font-family:'Cinzel','Trajan Pro',serif;
    font-size:clamp(8px,2.2cqw,13px);
    letter-spacing:.42em;
    margin-left:.42em;
    color:#F4EFE7;
    margin-top:6px;
    font-weight:400;
  }
  .hint{
    font-size:12.5px;
    color:#8A8377;
    letter-spacing:.05em;
  }
  /* ---------- ACTIONS ---------- */
  .actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:11px 20px;
    border-radius:999px;
    border:1.5px solid var(--bordeaux);
    color:var(--bordeaux);
    background:rgba(255,255,255,.65);
    font-family:inherit;
    font-size:14.5px;
    font-weight:500;
    letter-spacing:.03em;
    text-decoration:none;
    cursor:pointer;
    transition:all .2s ease;
  }
  .btn:hover{background:var(--bordeaux);color:#fff;transform:translateY(-1px);}
  .btn.primary{background:var(--bordeaux);color:#fff;border-color:var(--bordeaux);}
  .btn.primary:hover{background:var(--bordeaux-dark);}
  .btn svg{width:16px;height:16px;flex:none;}
</style>
</head>
